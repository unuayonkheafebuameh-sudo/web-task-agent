<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6531f">
<title>WTA | Web Task Agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff8a4c'/%3E%3Cstop offset='1' stop-color='%23f6531f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='36' height='36' rx='9' fill='url(%23g)'/%3E%3Cpath d='M7 10l5 16 6-11 6 11 5-16' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='18' cy='15' r='2.6' fill='%23ffd43b'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--orange:#f6531f;--orange-d:#d94312;--orange-l:#fff1ec;--green:#1a7f37;--green-bg:#e6f6ec;--yellow:#9a6700;--yellow-bg:#fff8c5;--red:#cf222e;--red-bg:#ffebe9;--line:#e5e5e5;--bg:#f7f7f8;--text:#1f2328;--muted:#6b7280}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.top{position:fixed;top:0;left:0;right:0;height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;z-index:20}
.brand{display:flex;align-items:center;gap:8px}
.logo{font-weight:bold;font-size:21px;color:var(--orange);letter-spacing:1px}
.crumb{display:none;color:var(--muted);font-size:14px;margin-left:10px}
.crumb b{color:var(--text);font-weight:600}
.menu-btn{background:none;border:1px solid var(--line);border-radius:6px;font-size:18px;padding:4px 10px;cursor:pointer}
.right{margin-left:auto;display:flex;align-items:center;gap:10px}
.who{font-size:13px;color:var(--muted);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:none}
.bell{position:relative;background:#fff;border:1px solid var(--line);border-radius:8px;width:38px;height:36px;cursor:pointer;font-size:16px}
.bell i{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;font-style:normal;padding:1px 5px}
.btn{background:var(--orange);color:#fff;border:0;border-radius:6px;padding:9px 15px;font-size:14px;cursor:pointer;display:inline-block;text-align:center}
.btn:hover{background:var(--orange-d)}
.btn:disabled{opacity:.6;cursor:default}
.btn-o{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn-o:hover{background:#f3f3f3}
.btn-r{background:#fff;color:var(--red);border:1px solid #f4b7bb}
.btn-r:hover{background:var(--red-bg)}
.btn-s{padding:6px 11px;font-size:13px}
.side{position:fixed;top:56px;bottom:0;left:0;width:260px;background:#fff;border-right:1px solid var(--line);padding:6px 8px 0;overflow-y:auto;transform:translateX(-100%);transition:transform .2s;z-index:15}
.side.open{transform:translateX(0)}
.gbtn{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:12px 10px 7px;font-size:13px;color:var(--muted);font-weight:bold;cursor:pointer;text-align:left}
.gitems{display:none}
.gitems.open{display:block}
.side a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;font-size:14.5px}
.side a:hover{background:#f3f3f3}
.side a.active{background:var(--orange-l);color:var(--orange);font-weight:bold}
.sfoot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);margin:10px -8px 0;padding:12px;display:flex;align-items:center;gap:10px}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:15px}
.sfoot b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.sfoot small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.shade{display:none;position:fixed;inset:56px 0 0 0;background:rgba(0,0,0,.3);z-index:10}
.shade.show{display:block}
main{padding:76px 14px 36px;max-width:1300px}
h2{margin:0 0 4px;font-size:23px}
h3{margin:0;font-size:16px}
h4{margin:0 0 6px;font-size:14px}
.sub{color:var(--muted);margin:0 0 18px;font-size:14.5px;line-height:1.5}
.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-top:3px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.dash{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{display:flex;gap:12px;align-items:center;padding:14px}
.sico{width:42px;height:42px;border-radius:11px;background:var(--orange-l);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.num{font-size:26px;font-weight:bold;line-height:1}
.label{color:var(--muted);font-size:13px;margin-top:4px}
.wsp{padding:0;overflow:hidden}
.wsp-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.wsp-body{background:#fafafa;padding:16px;display:flex;flex-direction:column;gap:14px}
.ai{display:flex;gap:10px;align-items:flex-start}
.ai .av{flex:none;width:30px;height:30px}
.ai .tx{background:#fff;border:1px solid var(--line);border-radius:12px;border-top-left-radius:4px;padding:12px 14px;line-height:1.5;font-size:14.5px;max-width:94%}
.brief{margin:8px 0 0;padding:0;list-style:none}
.brief li{display:flex;gap:9px;align-items:center;padding:3px 0;font-size:14px}
.brief .bd{width:8px;height:8px;border-radius:50%;flex:none}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:8px 13px;font-size:13.5px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--orange);color:var(--orange-d)}
.wsp-comp{display:flex;gap:8px;align-items:flex-end;background:#fff;border:1px solid #ffd0bf;border-radius:14px;padding:8px}
.wsp-comp:focus-within{border-color:var(--orange)}
.wsp-comp textarea{flex:1;border:0;resize:none;min-height:46px;max-height:140px;font-size:15px;font-family:inherit;padding:8px;outline:none;background:transparent}
.send-round{flex:none;width:42px;height:42px;border-radius:50%;background:var(--orange);color:#fff;border:0;font-size:18px;cursor:pointer}
.send-round:hover{background:var(--orange-d)}
.prow{padding:11px 0;border-bottom:1px solid #f0f0f0}
.prow:last-child{border-bottom:0;padding-bottom:0}
.prow-top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.prow-top span:first-child{overflow-wrap:anywhere}
.prow-top span:last-child{color:var(--muted);font-size:12.5px;white-space:nowrap}
.prog{height:6px;background:#f0f0f0;border-radius:4px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--orange);border-radius:4px}
.feed{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f0f0f0}
.feed:last-child{border-bottom:0;padding-bottom:0}
.feed .fi{flex:none;width:30px;height:30px;border-radius:50%;background:var(--orange-l);display:flex;align-items:center;justify-content:center;font-size:14px}
.feed.ok .fi{background:var(--green-bg)}
.feed div{font-size:13.5px;line-height:1.4;overflow-wrap:anywhere}
.feed small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.arow{padding:11px 0;border-bottom:1px solid #f0f0f0}
.arow:last-child{border-bottom:0;padding-bottom:0}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;white-space:nowrap}
.b-yellow{background:var(--yellow-bg);color:var(--yellow)}
.b-green{background:var(--green-bg);color:var(--green)}
.b-orange{background:var(--orange-l);color:var(--orange-d)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-grey{background:#eef0f2;color:#4b5563}
.empty{text-align:center;padding:22px 10px;color:var(--muted);font-size:14px;line-height:1.5}
.empty .ico{font-size:28px;margin-bottom:6px}
.empty b{display:block;color:var(--text);margin-bottom:2px}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.split .detailpane{display:none}
.split.has-detail .detailpane{display:block}
.split.has-detail .listpane{display:none}
.backlink{margin-bottom:12px}
.tfilter{display:flex;gap:6px;margin:10px 0}
.tfilter button{flex:1;padding:7px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:13px}
.tfilter button.on{background:var(--orange-l);color:var(--orange-d);border-color:var(--orange);font-weight:bold}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14.5px;font-family:inherit}
.titem{display:block;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:#fff}
.titem.sel{border-color:var(--orange);background:var(--orange-l)}
.titem .tt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.titem b{font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.flow{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px}
.node{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.node.d{border-color:#b7e1c4;background:#f6fcf8}
.node.n{border-style:dashed;color:var(--muted)}
.node .ni{flex:none;width:28px;height:28px;border-radius:8px;background:var(--orange-l);display:flex;align-items:center;justify-content:center;font-size:14px}
.node.d .ni{background:var(--green-bg);color:var(--green);font-weight:bold}
.node b{display:block;font-size:14px}
.node small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.4;overflow-wrap:anywhere}
.conn{width:2px;height:16px;background:#d4d7dc}
.conn.d{background:#8fd0a5}
.feat{margin:0;padding:0;list-style:none}
.feat li{padding:8px 0 8px 22px;position:relative;border-bottom:1px solid #f0f0f0;font-size:14px;line-height:1.45}
.feat li:last-child{border-bottom:0}
.feat li:before{content:"";position:absolute;left:3px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--orange)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.qchip{display:inline-block;background:#f3f4f6;border-radius:6px;padding:5px 9px;margin:0 6px 6px 0;font-size:13px}
.sec{padding:12px 0;border-bottom:1px solid #f0f0f0}
.sec:last-child{border-bottom:0;padding-bottom:0}
.sec p{margin:0;line-height:1.5;font-size:14px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.note{background:var(--yellow-bg);border-radius:8px;padding:10px 12px;font-size:13.5px;line-height:1.45;margin-top:12px;color:#5c4400}
.pg-hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#fff1ec 0%,#ffffff 80%);border:1px solid #ffd9cc;border-radius:14px;padding:22px 18px;margin-bottom:16px}
.pg-ico{flex:none;width:64px;height:64px;border-radius:16px;background:#fff;border:1px solid #ffd9cc;display:flex;align-items:center;justify-content:center;font-size:32px}
.pg-hero h2{font-size:25px;margin-bottom:6px}
.pg-hero p{margin:0 0 8px;color:#4b5563;line-height:1.5}
.pg-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:16px}
.fcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;min-height:120px}
.fcard .fico{width:38px;height:38px;border-radius:10px;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px}
.fcard p{margin:0;font-size:15px;line-height:1.5}
.related{display:grid;grid-template-columns:1fr;gap:12px}
.rel{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px}
.rel .sico{width:38px;height:38px}
.rel b{display:block;font-size:14.5px}
.rel small{color:var(--muted);font-size:13px;line-height:1.4}
.tabbar{display:flex;gap:8px;margin-bottom:14px}
.tabbar button{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:14px}
.tabbar button.on{background:var(--orange-l);color:var(--orange-d);border-color:var(--orange);font-weight:bold}
.task-ta{width:100%;min-height:110px;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;resize:vertical;background:#fff}
.msgline{font-size:13px;margin-top:8px;min-height:16px;color:var(--red)}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
.chat{display:flex;flex-direction:column;gap:10px;min-height:220px}
.bub{max-width:88%;padding:10px 14px;border-radius:12px;font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.u{align-self:flex-end;background:var(--orange);color:#fff;border-bottom-right-radius:4px}
.bub.a{align-self:flex-start;background:#f3f4f6;border-bottom-left-radius:4px}
.bub.err{background:var(--red-bg);color:var(--red)}
.composer{display:flex;gap:8px;margin-top:14px;align-items:flex-end}
.composer textarea{flex:1;min-height:44px;max-height:160px;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;resize:vertical}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.box{background:#fff;border-radius:10px;padding:20px;width:100%;max-width:380px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px}
.tab.on{background:var(--orange-l);color:var(--orange);border-color:var(--orange);font-weight:bold}
.box input{width:100%;padding:10px;margin-bottom:10px;border:1px solid var(--line);border-radius:6px;font-size:15px}
.msg{font-size:13px;margin:4px 0 12px;min-height:16px}
.msg.err{color:var(--red)}
.msg.ok{color:var(--green)}
.row{display:flex;gap:8px}
.row .btn{flex:1}
@media(min-width:600px){.who{display:block}.stats{grid-template-columns:repeat(4,1fr)}.pg-grid{grid-template-columns:repeat(3,1fr)}.related{grid-template-columns:1fr 1fr}}
@media(min-width:800px){
.menu-btn{display:none}
.crumb{display:block}
.side{transform:none}
.shade{display:none!important}
main{margin-left:260px;padding:80px 32px 40px}
}
@media(min-width:1000px){
.dash{grid-template-columns:minmax(0,1fr) 340px}
.split{grid-template-columns:360px minmax(0,1fr)}
.split .detailpane{display:block}
.split.has-detail .listpane{display:block}
.backlink{display:none}
}
@media(prefers-reduced-motion:reduce){.side{transition:none}}
</style>
</head>
<body>
<div class="top">
<button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
<a class="brand" href="#dashboard">
<svg width="30" height="30" viewBox="0 0 36 36" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a4c"/><stop offset="1" stop-color="#f6531f"/></linearGradient></defs><rect width="36" height="36" rx="9" fill="url(#lg)"/><path d="M7 10l5 16 6-11 6 11 5-16" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="15" r="2.6" fill="#ffd43b"/></svg>
<span class="logo">WTA</span>
</a>
<span class="crumb" id="crumb"></span>
<div class="right" id="authArea"></div>
</div>
<nav class="side" id="side"></nav>
<div class="shade" id="shade"></div>
<main id="view"></main>

<div class="modal" id="modal">
<div class="box">
<div class="tabs">
<button class="tab on" id="tabIn" type="button">Sign in</button>
<button class="tab" id="tabUp" type="button">Create account</button>
</div>
<input id="email" type="email" placeholder="Email" autocomplete="email">
<input id="password" type="password" placeholder="Password (8+ characters)" autocomplete="current-password">
<div class="msg" id="msg"></div>
<div class="row">
<button class="btn btn-o" id="cancelBtn" type="button">Cancel</button>
<button class="btn" id="submitBtn" type="button">Sign in</button>
</div>
</div>
</div>

<script src="app.js"></script>
  <script src="research.js"></script>
</body>
</html>
